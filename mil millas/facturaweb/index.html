<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Web</title>
    <script src="./js/main.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <div class="contenedor">
  <h1>Proyecto para factura web</h1>
  <form action="">
    <input type="number" id="id" placeholder="ingrese su identificacion" >
    <br> <br>
    <input type="text" name="nom" id="nom" placeholder="ingrese su nombre y apellidos">
    <br> <br>
    <input type="text" name="dir" id="dir" placeholder="ingrese su direccion">
    <br> <br>
    <input type="number" name="tel" id="tel" placeholder="ingrese su telefonos">
    <br> <br>
    <input type="number" name="nfac" id="nfac" placeholder="ingrese su numero de factura">
    <br> <br>
    <label for="">"ingrese la fecha"</label>
    <br><br>
    <input type="date" name="fecha" id="fecha" placeholder="ingrese la fecha">
    <br> <br>
    <input type="text" name="rasocial" id="rs" placeholder="ingrese la razon social">
    <br> <br>
    <input type="text" name="producto" id="p" placeholder="ingrese el pruducto">
    <br> <br>
    <input type="number" name="cant" id="cant" placeholder="ingrese la cantidad">
    <br> <br>
    <input type="number" name="vu" id="vu" placeholder="ingrese valor unitario del producto">
    <br> <br>
    <input type="button" value="mostrar factura" onclick="mostrar()">
  </form>
  <br>
  </div>
</body>
</html>
