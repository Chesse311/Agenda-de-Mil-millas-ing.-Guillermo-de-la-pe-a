<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calcular masa muscular</title>
    <script src="./js/script.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <h1>
        Calcula tu masa corporal
    </h1>
    <div class="cuerpo">
        <form action="">
            <label class="sub_titulo" for="">Ingrese su identificacion:</label>
            <input class="form_estilo" type="text" id="id" placeholder="ej. 1064773492">
            <br>
            <label class="sub_titulo" for="">Ingrese su nombre:</label>
            <input class="form_estilo" type="text" id="nom" placeholder="ej. Pepito Perez">
            <br>
            <label class="sub_titulo" for="">Ingrese su altura en metros:</label>
            <input class="form_estilo" type="number" id="altura" placeholder="ej. 1.70">
            <br>
            <label class="sub_titulo" for="">Ingrese su peso en kilogramos</label>
            <input class="form_estilo" type="number" id="peso" placeholder="ej. 75">
            <br>
            <input class="btn" type="button" value="Calcular" onclick="calculo()">
        </form>
        <a class="btn" href="../index.html">Volver a proyectos</a>
    </div>
    <br>
    
    
</body>
</html>
